[env:kb-heltec-wsl-v3]
custom_meshtastic_hw_model = 44
custom_meshtastic_hw_model_slug = HELTEC_WSL_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Kiezbox (HELTEC_WSL_V3)
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board_level = extra
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -D HELTEC_WSL_V3
  -I variants/esp32s3/kiezbox_v1
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=DHT sensor library packageName=adafruit/library/DHT sensor library
  adafruit/DHT sensor library@1.4.7
  # renovate: datasource=custom.pio depName=OneWire packageName=paulstoffregen/library/OneWire
  paulstoffregen/OneWire@2.3.8
  # renovate: datasource=custom.pio depName=DallasTemperature packageName=milesburton/library/DallasTemperature
  milesburton/DallasTemperature@3.11.0
  # renovate: datasource=custom.pio depName=RTClib packageName=adafruit/library/RTClib
  adafruit/RTClib@2.1.4
  # renovate: datasource=custom.pio depName=Nova Fitness Sds dust sensors library packageName=lewapek/library/Nova Fitness Sds dust sensors library
  lewapek/Nova Fitness Sds dust sensors library@1.5.1
